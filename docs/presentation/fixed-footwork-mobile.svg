<text x="26" y="947" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#657282">Filled cloth cell = warp above weft.</text>
<text x="26" y="974" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#657282">E1 threads shaft 1; E2 threads shaft 2.</text>
<text x="26" y="1134" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#963c40" font-weight="700">Without pair 1 + 2: Infeasible.</text>
<text x="26" y="1166" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#185fbd" font-weight="700">With pair 1 + 2: Feasible. All lifts retained.</text>
<text x="26" y="1206" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#657282">Schematic union model; no physical loom approval.</text>
