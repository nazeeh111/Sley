<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1290" viewBox="0 0 420 1290" role="img" aria-labelledby="sley-title sley-desc"><title id="sley-title">Keep the lifts. Change the footwork.</title><desc id="sley-desc">An actual four-pick synthetic weaving draft uses three physical pedal positions. Pedal 1 is fixed to shaft 1, pedal 2 is assigned shaft 2, and pedal 3 stays untied. Picks press 1, then 2, then the allowed pair 1 and 2, then no pedal. All eight drawdown cells and original lifts survive WIF export and fresh reopening. Without pair 1 and 2 these fixed constraints are infeasible. This is a rising-shed union model, not physical loom validation.</desc><rect width="100%" height="100%" fill="#f7f5ef"/>
<text x="26" y="36" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#185fbd" font-weight="700">SLEY / ONE DRAFT, FIXED PHYSICAL PEDALS</text>
<text x="26" y="82" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#192533" font-weight="700">Keep the lifts.</text>
<text x="26" y="124" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#192533" font-weight="700">Change the footwork.</text>
<text x="26" y="161" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#657282">Actual WIF export and fresh reopening.</text>
<text x="26" y="218" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#185fbd" font-weight="700">THE TIE-UP</text>
<text x="26" y="268" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#192533" font-weight="700">Pedal 1</text>
<text x="150" y="268" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#192533">Fixed: shaft 1</text>
<text x="26" y="332" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#192533" font-weight="700">Pedal 2</text>
<text x="150" y="332" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#192533">Free -&gt; shaft 2</text>
<text x="26" y="396" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#192533" font-weight="700">Pedal 3</text>
<text x="150" y="396" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#192533">Fixed: untied</text>
<text x="26" y="480" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#185fbd" font-weight="700">ALL FOUR PICKS / ORIGINAL ORDER</text>
<text x="87" y="544" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#192533" font-weight="700">Cloth</text>
<text x="236" y="544" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#192533" font-weight="700">Press pedals</text>
<text x="26" y="578" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#192533">Pick</text>
<text x="108.5" y="596" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#192533" text-anchor="middle">E1</text>
<text x="153.5" y="596" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#192533" text-anchor="middle">E2</text>
<text x="256.5" y="596" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#192533" text-anchor="middle">1</text>
<text x="301.5" y="596" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#192533" text-anchor="middle">2</text>
