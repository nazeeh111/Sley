<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sley fixed footwork</title><style>body{margin:0}svg{display:block;max-width:100%;height:auto}</style><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="sley-title sley-desc"><title id="sley-title">Keep the lifts. Change the footwork.</title><desc id="sley-desc">An actual four-pick synthetic weaving draft uses three physical pedal positions. Pedal 1 is fixed to shaft 1, pedal 2 is assigned shaft 2, and pedal 3 stays untied. Picks press 1, then 2, then the allowed pair 1 and 2, then no pedal. All eight drawdown cells and original lifts survive WIF export and fresh reopening. Without pair 1 and 2 these fixed constraints are infeasible. This is a rising-shed union model, not physical loom validation.</desc><rect width="100%" height="100%" fill="#f7f5ef"/>
