name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Browser model tests and module syntax
        run: |
          node --test sley/static/model.test.mjs
          node --check sley/static/app.js
          node --check sley/static/model.mjs
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Installed wheel workflow outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/sley-installed"
          "$RUNNER_TEMP/sley-installed/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cp tests/installed_smoke.py "$RUNNER_TEMP/sley-installed-smoke.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sley-installed/bin/python" -I sley-installed-smoke.py
